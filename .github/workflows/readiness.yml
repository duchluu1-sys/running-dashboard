name: Morning Readiness

on:
  schedule:
    # Times are UTC. Hanoi = UTC+7.
    # NEVER use minute 0 — top-of-hour is the most contested slot on GitHub
    # Actions and scheduled runs there get delayed hours or dropped silently.
    - cron: '23 23 * * *'   # 06:23 Hanoi — primary
    - cron: '47 0 * * *'    # 07:47 Hanoi — backup, only writes if primary produced nothing
  workflow_dispatch:         # Manual trigger button in GitHub UI

permissions:
  contents: write            # Allows committing data.json

concurrency:
  group: data-json          # Prevents the two crons from racing each other
  cancel-in-progress: false

jobs:
  readiness:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install garminconnect requests

      - name: Run readiness script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          FORCE_WRITE: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: python scripts/morning_readiness.py
